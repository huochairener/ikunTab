version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ikuntab-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-ikuntab}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ikuntab-app
    restart: always
    ports:
      - "8090:8090"
    environment:
      IKUN_ENV: prod
      IKUN_MYSQL_HOST: mysql
      IKUN_MYSQL_PORT: 3306
      IKUN_MYSQL_DB: ${MYSQL_DB:-ikuntab}
      IKUN_MYSQL_USER: ${MYSQL_USER:-root}
      IKUN_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      IKUN_JWT_SECRET: ${JWT_SECRET:-ikun-tab-secret-key-please-change-this-to-a-long-random-string-123456}
      IKUN_HOTLIST_API_URL: ${IKUN_HOTLIST_API_URL:-http://localhost:3000}
    volumes:
      - app-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  app-uploads:
